<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>

<style>
body{
font-family:Arial;
background:#f4f6f9;
padding:20px;
}

h2{
color:#333;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
background:white;
}

th,td{
padding:10px;
border:1px solid #ddd;
text-align:left;
}

th{
background:#4facfe;
color:white;
}

</style>

</head>

<body>

<h2>👨‍💼 Admin Dashboard</h2>

<h3>👤 Registered Users</h3>

<table>
<tr>
<th>Username</th>
</tr>

{% for user in users %}
<tr>
<td>{{ user[0] }}</td>
</tr>
{% endfor %}

</table>

<h3>🧠 Mood History</h3>

<table>
<tr>
<th>User</th>
<th>Emotion</th>
<th>Date</th>
</tr>

{% for mood in moods %}
<tr>
<td>{{ mood[0] }}</td>
<td>{{ mood[1] }}</td>
<td>{{ mood[2] }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
